name = "obscura"
main = "worker/index.ts"
account_id = "ef9d8674583500d44ec5fd99dd074a29"
workers_dev = true
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
GROQ_MODEL = "qwen/qwen3.8-27b"

[[d1_databases]]
binding = "DB"
database_name = "dope-security"
database_id = "4d0ca9c9-dc34-418e-854c-b80508f0237b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "dope-security-artifacts"

[[workflows]]
name = "dependency-scan"
binding = "SCAN_WORKFLOW"
class_name = "ScanWorkflow"

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "WORK_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
